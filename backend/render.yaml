services:
  - type: web
    name: copa-chatbot-api
    runtime: python
    rootDir: backend
    buildCommand: uv sync --frozen
    startCommand: uv run gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: FRONTEND_ORIGINS
        sync: false
      - key: MAX_HISTORY
        value: "16"
      - key: MAX_MESSAGE_CHARS
        value: "4000"
