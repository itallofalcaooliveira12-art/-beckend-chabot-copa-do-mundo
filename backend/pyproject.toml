[project]
name = "copa-chatbot-backend"
version = "1.0.0"
description = "Backend Flask + Groq para chatbot especializado em Copas do Mundo, futebol e esportes."
requires-python = ">=3.11,<3.15"
dependencies = [
    "flask>=3.1,<4",
    "flask-cors>=6,<7",
    "groq>=0.31,<1",
    "gunicorn>=23,<24",
    "python-dotenv>=1.1,<2",
]

[tool.uv]
package = false
